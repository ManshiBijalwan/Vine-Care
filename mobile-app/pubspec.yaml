name: vinecare
description: VineCare — Precision Viticulture Platform for KOKOTOS ESTATE
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Google Fonts — loads Inter automatically, no manual font files needed
  google_fonts: ^6.2.1
  # HTTP client
  http: ^1.2.0
  # Shared preferences for auth token storage
  shared_preferences: ^2.2.3
  # File picker (multi-file, for drone upload)
  file_picker: ^8.0.0+1
  # Intl for date formatting
  intl: ^0.19.0
  # Dio for multipart upload
  dio: ^5.4.3+1
  # Go Router for navigation
  go_router: ^13.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
